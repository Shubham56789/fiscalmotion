
spring:
  application:
    name: fiscalmotion

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ledgerflow}
    username: ${DB_USER:dbuser}
    password: ${DB_PASSWORD:dbpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  config:
    import: optional:file:.env[.properties]

resilience4j:
  ratelimiter:
    metrics:
      enabled: true
    instances:
      ledgerTransferApi:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 50ms

  circuitbreaker:
    metrics:
      enabled: true
    instances:
      externalPaymentGateway:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

    endpoint:
      prometheus:
        enabled: true
      health:
        show-details: always

    metrics:
      tags:
        application: fiscalmotion-engine
      distribution:
        percentiles-histogram:
          http.server.requests: true

fiscalmotion:
  bulk:
    enabled: true

  owner:
    bootstrap-enabled: ${FM_OWNER_BOOTSTRAP:false}
    email: ${FM_OWNER_EMAIL:}
    name: ${FM_OWNER_NAME:Owner}
    password: ${FM_OWNER_PASSWORD:}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${FM_SECURE_COOKIE:false}
      timeout: 30m
