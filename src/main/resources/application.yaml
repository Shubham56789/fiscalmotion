spring:
  application:
    name: fiscalmotion
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ledgerflow}
    username: ${DB_USER:dbuser}
    password: ${DB_PASSWORD:dbpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  config:
    import: optional:file:.env[.properties]


resilience4j:
  ratelimiter:
    metrics:
      enabled: true
    instances:
      ledgerTransferApi:
        limitForPeriod: 10          # Max 100 requests allowed
        limitRefreshPeriod: 1s       # Per 1 second window
        timeoutDuration: 50ms       # Wait up to 100ms for permission before throwing RateLimitExceededException

  circuitbreaker:
    metrics:
      enabled: true
    instances:
      externalPaymentGateway:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50     # Trip circuit if 50% of requests fail
        waitDurationInOpenState: 10s # Stay OPEN for 10 seconds before HALF-OPEN
        permittedNumberOfCallsInHalfOpenState: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
    endpoint:
      prometheus:
        enabled: true
      health:
        show-details: always
    metrics:
      tags:
        application: fiscalmotion-engine
      distribution:
        percentiles-histogram:
          http.server.requests: true

fiscalmotion:
  bulk:
    enabled: true

  security:
    admin:
      username: ${FM_ADMIN_USERNAME}
      password: ${FM_ADMIN_PASSWORD}

    user:
      username: ${FM_USER_USERNAME}
      password: ${FM_USER_PASSWORD}